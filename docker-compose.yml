services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PINECONE_API_KEY
      - PINECONE_INDEX
      - GROQ_API_KEY
      - LOG_LEVEL=INFO
      - SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SENTRY_TRACES_SAMPLE_RATE
    volumes:
      - marketplace-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  marketplace-data:
