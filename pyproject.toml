[project]
name = "marketplace-reviewer"
version = "1.0.0"
description = "Reviews product/service listings against a marketplace policy and brand-content guide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.0",
    "langchain-groq>=1.0",
    "langchain-pinecone>=0.2",
    "pinecone>=7.0",
    "langchain-huggingface>=1.0",
    "langchain-community>=0.3",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "nltk>=3.8",
    "pypdf>=4.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.25",
    "ruff>=0.5.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]


[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-fail-under=60"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "llm*", "pro*", "ingestion*", "tests*", "validator*"]
exclude = ["frontend*", "docs2*", "samples*"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]  # allow assert and print in tests
"llm/chat.py" = ["E501"]  # prompt templates intentionally use readable long lines
"store.py" = ["E501", "T201"]
"validator.py" = ["T201"]
"ingest.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "httpx>=0.25",
    "ruff>=0.5.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]